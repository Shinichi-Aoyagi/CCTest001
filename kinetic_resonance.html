<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Resonance - Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button.purple {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
        }

        .button.purple:hover {
            background: linear-gradient(135deg, #8e44ad, #7d3c98);
        }

        .button.pink {
            background: linear-gradient(135deg, #e91e63, #c2185b);
        }

        .button.pink:hover {
            background: linear-gradient(135deg, #c2185b, #ad1457);
        }

        .button.cyan {
            background: linear-gradient(135deg, #00bcd4, #0097a7);
        }

        .button.cyan:hover {
            background: linear-gradient(135deg, #0097a7, #00838f);
        }

        .button.blue {
            background: linear-gradient(135deg, #2196f3, #1976d2);
        }

        .button.blue:hover {
            background: linear-gradient(135deg, #1976d2, #1565c0);
        }

        .button.yellow {
            background: linear-gradient(135deg, #ffc107, #ffa000);
        }

        .button.yellow:hover {
            background: linear-gradient(135deg, #ffa000, #ff8f00);
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Kinetic Resonance</h1>
            <div class="subtitle">Radial waves propagating through geometric space, where velocity becomes color and collision becomes convergence.</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button blue" onclick="previousSeed()">← Prev</button>
                    <button class="button cyan" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button purple regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <!-- Wave Count -->
                <div class="control-group">
                    <label>Wave Centers</label>
                    <div class="slider-container">
                        <input type="range" id="waveCount" min="2" max="8" step="1" value="4" oninput="updateParam('waveCount', this.value)">
                        <span class="value-display" id="waveCount-value">4</span>
                    </div>
                </div>

                <!-- Particles per Wave -->
                <div class="control-group">
                    <label>Particles per Wave</label>
                    <div class="slider-container">
                        <input type="range" id="particlesPerWave" min="50" max="300" step="10" value="120" oninput="updateParam('particlesPerWave', this.value)">
                        <span class="value-display" id="particlesPerWave-value">120</span>
                    </div>
                </div>

                <!-- Wave Speed -->
                <div class="control-group">
                    <label>Wave Speed</label>
                    <div class="slider-container">
                        <input type="range" id="waveSpeed" min="0.5" max="4.0" step="0.1" value="1.5" oninput="updateParam('waveSpeed', this.value)">
                        <span class="value-display" id="waveSpeed-value">1.5</span>
                    </div>
                </div>

                <!-- Angular Velocity -->
                <div class="control-group">
                    <label>Angular Velocity</label>
                    <div class="slider-container">
                        <input type="range" id="angularVelocity" min="0.0" max="0.1" step="0.005" value="0.02" oninput="updateParam('angularVelocity', this.value)">
                        <span class="value-display" id="angularVelocity-value">0.02</span>
                    </div>
                </div>

                <!-- Particle Lifespan -->
                <div class="control-group">
                    <label>Particle Lifespan</label>
                    <div class="slider-container">
                        <input type="range" id="particleLifespan" min="50" max="300" step="10" value="150" oninput="updateParam('particleLifespan', this.value)">
                        <span class="value-display" id="particleLifespan-value">150</span>
                    </div>
                </div>

                <!-- Spawn Interval -->
                <div class="control-group">
                    <label>Spawn Interval</label>
                    <div class="slider-container">
                        <input type="range" id="spawnInterval" min="10" max="100" step="5" value="40" oninput="updateParam('spawnInterval', this.value)">
                        <span class="value-display" id="spawnInterval-value">40</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button yellow" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing kinetic resonance...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            waveCount: 4,
            particlesPerWave: 120,
            waveSpeed: 1.5,
            angularVelocity: 0.02,
            particleLifespan: 150,
            spawnInterval: 40
        };

        let defaultParams = {...params};

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS GENERATIVE ART ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let waveCenters = [];
        let waves = [];
        let frameCounter = 0;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');

            initializeSystem();

            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            // Clear existing data
            waves = [];
            frameCounter = 0;

            // Generate wave centers using golden angle for optimal spacing
            waveCenters = [];
            const goldenAngle = PI * (3 - sqrt(5));

            for (let i = 0; i < params.waveCount; i++) {
                const angle = i * goldenAngle;
                const radius = sqrt(i / params.waveCount) * min(width, height) * 0.3;
                const x = width / 2 + cos(angle) * radius;
                const y = height / 2 + sin(angle) * radius;

                // Add slight noise for organic variation
                const noiseOffset = noise(i * 0.1) * 50 - 25;

                waveCenters.push({
                    x: x + noiseOffset,
                    y: y + noiseOffset,
                    phase: i * TWO_PI / params.waveCount,
                    hueBase: (i / params.waveCount) * 360
                });
            }

            // Dark background for dramatic contrast
            background(15, 15, 20);
        }

        function draw() {
            // Subtle fade for trail effect
            fill(15, 15, 20, 8);
            noStroke();
            rect(0, 0, width, height);

            frameCounter++;

            // Spawn new waves at intervals
            if (frameCounter % params.spawnInterval === 0) {
                for (let center of waveCenters) {
                    waves.push(new Wave(center));
                }
            }

            // Update and draw all waves
            for (let i = waves.length - 1; i >= 0; i--) {
                waves[i].update();
                waves[i].display();

                if (waves[i].isDead()) {
                    waves.splice(i, 1);
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // WAVE SYSTEM
        // ═══════════════════════════════════════════════════════════════════════

        class Wave {
            constructor(center) {
                this.center = center;
                this.particles = [];
                this.age = 0;

                // Create particles in a radial pattern
                for (let i = 0; i < params.particlesPerWave; i++) {
                    const angle = (i / params.particlesPerWave) * TWO_PI;
                    this.particles.push(new Particle(
                        center.x,
                        center.y,
                        angle,
                        center.phase,
                        center.hueBase
                    ));
                }
            }

            update() {
                this.age++;
                for (let p of this.particles) {
                    p.update();
                }
            }

            display() {
                for (let p of this.particles) {
                    p.display();
                }
            }

            isDead() {
                return this.age > params.particleLifespan;
            }
        }

        class Particle {
            constructor(x, y, angle, phase, hueBase) {
                this.pos = createVector(x, y);
                this.angle = angle;
                this.radius = 0;
                this.speed = params.waveSpeed;
                this.angularVel = params.angularVelocity;
                this.phase = phase;
                this.hueBase = hueBase;
                this.age = 0;
                this.maxAge = params.particleLifespan;

                // Add slight randomness to initial angle for organic spread
                this.angle += random(-0.1, 0.1);
            }

            update() {
                this.age++;

                // Expand outward with slight spiral
                this.radius += this.speed;
                this.angle += this.angularVel;

                // Add subtle noise-based perturbation
                const noiseVal = noise(this.angle * 0.5, this.radius * 0.01, frameCount * 0.01);
                const perturbation = (noiseVal - 0.5) * 2;

                this.angle += perturbation * 0.02;
            }

            display() {
                // Calculate position
                const x = this.pos.x + cos(this.angle) * this.radius;
                const y = this.pos.y + sin(this.angle) * this.radius;

                // Check if particle is within canvas
                if (x < -50 || x > width + 50 || y < -50 || y > height + 50) {
                    return;
                }

                // Calculate lifecycle fade
                const lifeRatio = this.age / this.maxAge;
                let alpha;

                if (lifeRatio < 0.1) {
                    // Fade in
                    alpha = lifeRatio / 0.1;
                } else if (lifeRatio > 0.8) {
                    // Fade out
                    alpha = (1 - lifeRatio) / 0.2;
                } else {
                    alpha = 1;
                }

                // Velocity-based color: faster = brighter/more saturated
                const velocity = this.speed + abs(this.angularVel * this.radius);
                const hue = (this.hueBase + velocity * 30 + this.radius * 0.2) % 360;
                const saturation = map(velocity, 0, 5, 50, 100);
                const brightness = map(velocity, 0, 5, 40, 90);

                // Size varies with lifecycle and velocity
                const baseSize = map(velocity, 0, 5, 1.5, 3.5);
                const size = baseSize * (1 - lifeRatio * 0.5);

                // Convert HSB to RGB manually for additive blending
                push();
                colorMode(HSB, 360, 100, 100);
                const col = color(hue, saturation, brightness);
                const r = red(col);
                const g = green(col);
                const b = blue(col);
                pop();

                // Draw particle with glow
                noStroke();

                // Outer glow
                fill(r, g, b, alpha * 30);
                circle(x, y, size * 4);

                // Inner glow
                fill(r, g, b, alpha * 100);
                circle(x, y, size * 2);

                // Core
                fill(r, g, b, alpha * 200);
                circle(x, y, size);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;

            // For parameters that affect ongoing animation, no need to restart
            // For structural parameters, restart the system
            if (paramName === 'waveCount') {
                initializeSystem();
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};

            // Update all UI elements
            document.getElementById('waveCount').value = params.waveCount;
            document.getElementById('waveCount-value').textContent = params.waveCount;
            document.getElementById('particlesPerWave').value = params.particlesPerWave;
            document.getElementById('particlesPerWave-value').textContent = params.particlesPerWave;
            document.getElementById('waveSpeed').value = params.waveSpeed;
            document.getElementById('waveSpeed-value').textContent = params.waveSpeed;
            document.getElementById('angularVelocity').value = params.angularVelocity;
            document.getElementById('angularVelocity-value').textContent = params.angularVelocity;
            document.getElementById('particleLifespan').value = params.particleLifespan;
            document.getElementById('particleLifespan-value').textContent = params.particleLifespan;
            document.getElementById('spawnInterval').value = params.spawnInterval;
            document.getElementById('spawnInterval-value').textContent = params.spawnInterval;

            updateSeedDisplay();
            initializeSystem();
        }

        // Initialize UI on load
        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
